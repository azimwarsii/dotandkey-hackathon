<html><head><link rel=stylesheet href="base.css"><style>
body{background:transparent;width:auto;height:auto}
.pill{display:inline-flex;align-items:center;gap:14px;padding:14px 26px 14px 16px;border-radius:999px;background:rgba(32,33,31,.92);color:#fff;font-size:24px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.num{font-size:17px;font-weight:600;background:var(--lime);color:#14150f;border-radius:999px;padding:5px 11px;letter-spacing:.04em}
.live{display:inline-flex;align-items:center;gap:12px;padding:13px 24px;border-radius:999px;background:#fff;color:var(--ink);font-size:22px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid var(--rule)}
.dot{width:13px;height:13px;border-radius:50%;background:#ff2f5b;box-shadow:0 0 0 5px rgba(255,47,91,.18)}
.live small{font-weight:500;color:var(--muted);font-size:20px}
</style></head><body><div id=o style="display:inline-block;padding:56px"></div></body></html>
