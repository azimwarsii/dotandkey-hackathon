services:
  web:
    build:
      context: .
      dockerfile: studio-web/Dockerfile
      args:
        STUDIO_BACKEND: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(4500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      CLIPFORGE_URL: http://clipforge:3000
      STUDIO_GRID_BIND_HOST: "::"
      STUDIO_GRID_CALLBACK_HOST: api
      PORT: 8000
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure
  clipforge:
    build:
      context: https://github.com/xixihhhh/clipforge.git#bded6ceaa46649068e8da5882d7c29fd8c977a3b
    environment:
      HOSTNAME: "::"
      PORT: 3000
      APP_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
    volumes:
      - clipforge-data:/data
    restart: on-failure
volumes:
  api-data:
  clipforge-data:
